name: recurrent-example
program: lsy_drone_racing/control/rl_race_multi/sweep.py
method: grid
metric: {name: final/leaderboard_score, goal: minimize}
command: ["${env}", pixi, run, -e, gpu, python, -m, lsy_drone_racing.control.rl_race_multi.sweep]
parameters:
  seed: {values: [1, 2]}
  hidden_size: {value: 256}
  unroll_length: {value: 32}
  sweep_trial_count: {value: 2}
