name: recurrent-performance
program: lsy_drone_racing/control/rl_race_multi/sweep.py
method: grid
metric: {name: final/leaderboard_score, goal: minimize}
command: ["${env}", pixi, run, -e, gpu, python, -m, lsy_drone_racing.control.rl_race_multi.sweep]
parameters:
  seed: {value: 1}
  hidden_size: {value: 256}
  policy_layers: {value: [512, 512]}
  value_layers: {value: [512, 512]}
  unroll_length: {value: 32}
  experiment:
    values:
      - {name: balanced, learning_rate: 0.0003, entropy_cost: 0.005, num_updates_per_batch: 4, switch_success: 0.3, sparse_switch_success: 0.9, eval_every_steps: 80000000}
      - {name: lower_lr, learning_rate: 0.0001, entropy_cost: 0.005, num_updates_per_batch: 4, switch_success: 0.3, sparse_switch_success: 0.9, eval_every_steps: 80000000}
      - {name: entropy_epochs, learning_rate: 0.0003, entropy_cost: 0.002, num_updates_per_batch: 2, switch_success: 0.3, sparse_switch_success: 0.9, eval_every_steps: 80000000}
      - {name: stricter_switch, learning_rate: 0.0003, entropy_cost: 0.005, num_updates_per_batch: 4, switch_success: 0.5, sparse_switch_success: 0.95, eval_every_steps: 40000000, race_time: 0.25}
  upload_checkpoint: {value: true}
  sweep_trial_count: {value: 4}
