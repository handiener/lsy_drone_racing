# 16 matched recipes x 2 reference paths x 2 seeds = 64 trials.
# One PPO iteration: 4,194,304 transitions, 128 optimizer updates.
name: newtrack_reference_ab_64
program: lsy_drone_racing/control/rl_race/sweep.py
method: grid
run_cap: 64
metric:
  name: final/balanced_score
  goal: minimize
command:
  - ${env}
  - pixi
  - run
  - -e
  - gpu
  - python
  - -m
  - lsy_drone_racing.control.rl_race.sweep
parameters:
  reference_path:
    values: [hermite, dynamic]
  seed:
    values: [1, 2]
  experiment:
    values:
      - &baseline
        name: baseline_80_70
        tilt_limit_deg: 80
        yaw_limit_deg: 70
        race_steps: 12582912000 # 3000 PPO iterations for every recipe.
        anneal_steps: 0
      - <<: *baseline
        name: anneal400
        anneal_steps: 1677721600
      - <<: *baseline
        name: actor_lr2e4
        policy_lr_after_switch: 0.0002
      - <<: *baseline
        name: entropy002
        entropy_cost: 0.002
      - <<: *baseline
        name: official_starts075
        official_start_prob: 0.75
      - <<: *baseline
        name: yaw80
        yaw_limit_deg: 80
      - <<: *baseline
        name: tilt85
        tilt_limit_deg: 85
      - <<: *baseline
        name: actor_lr15e4
        policy_lr_after_switch: 0.00015
      - <<: *baseline
        name: lr15e4_anneal400
        policy_lr_after_switch: 0.00015
        anneal_steps: 1677721600
      - <<: *baseline
        name: lr2e4_anneal400
        policy_lr_after_switch: 0.0002
        anneal_steps: 1677721600
      - <<: *baseline
        name: anneal400_entropy002
        anneal_steps: 1677721600
        entropy_cost: 0.002
      - <<: *baseline
        name: lr2e4_entropy002
        policy_lr_after_switch: 0.0002
        entropy_cost: 0.002
      - <<: *baseline
        name: lr15e4_anneal400_entropy002
        policy_lr_after_switch: 0.00015
        anneal_steps: 1677721600
        entropy_cost: 0.002
      - <<: *baseline
        name: lr15e4_anneal400_starts075
        policy_lr_after_switch: 0.00015
        anneal_steps: 1677721600
        official_start_prob: 0.75
      - <<: *baseline
        name: lr15e4_anneal400_time025
        policy_lr_after_switch: 0.00015
        anneal_steps: 1677721600
        race_time: 0.025
      - <<: *baseline
        name: lr15e4_anneal400_path_lateral05
        policy_lr_after_switch: 0.00015
        anneal_steps: 1677721600
        pretrain_path_lateral: 0.5
  start_stage: {value: pretrain}
  start_params: {value: null}
  max_episode_steps: {value: 1250}
  switch_success: {value: 0.3}
  pretrain_max_steps: {value: 2013265920}
  num_envs: {value: 16384}
  batch_size: {value: 4096}
  num_minibatches: {value: 32}
  unroll_length: {value: 32}
  num_updates_per_batch: {value: 4}
  policy_layers: {value: [256, 256, 256]}
  value_layers: {value: [256, 256, 256, 256]}
  activation: {value: swish}
  n_gates: {value: 2}
  official_start_prob: {value: 0.5}
  thrust_min_fraction: {value: 0.0}
  thrust_max_fraction: {value: 1.0}
  learning_rate: {value: 0.0003}
  policy_lr_after_switch: {value: 0.0001}
  entropy_cost: {value: 0.005}
  noise_scale: {value: 1.0}
  discounting: {value: 0.99}
  gae_lambda: {value: 0.95}
  clipping_epsilon: {value: 0.2}
  max_grad_norm: {value: 1.0}
  critic_only_iterations: {value: 10}
  lr_decay_to: {value: 1.0}
  pretrain_time: {value: 0.2}
  pretrain_crash: {value: 20}
  race_gate: {value: 5}
  race_lap: {value: 10}
  race_time: {value: 0.05}
  race_crash: {value: 20}
  anneal_to: {value: 0.1}
  intermediate_eval: {value: true}
  eval_every_steps: {value: 83886080}
  pretrain_eval_every_steps: {value: 83886080}
  race_eval_every_steps: {value: null}
  num_eval_envs: {value: 512}
  final_eval_episodes: {value: 1024}
  final_eval_seeds: {value: [510000, 520000, 530000]}
  final_eval_batch_size: {value: 256}
  upload_checkpoint: {value: true}
  sweep_trial_count: {value: 64}
  cloud_checkpoint_budget_gb: {value: 50}
